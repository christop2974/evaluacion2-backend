<div class="card property-card h-100 border-0 shadow-sm">{% if p.imagen %}<img src="{{p.imagen.url}}" class="card-img-top property-img">{% else %}<div class="property-placeholder"><i class="bi bi-house-door"></i></div>{% endif %}<div class="card-body"><div class="d-flex justify-content-between"><span class="badge text-bg-primary">{{p.operacion}}</span><span class="text-muted small">{{p.tipo}}</span></div><h5 class="mt-3 fw-bold">{{p.titulo}}</h5><p class="text-muted"><i class="bi bi-geo-alt"></i> {{p.comuna}}{% if p.sector %}, {{p.sector}}{% endif %}</p><h4 class="price">${{p.precio}}</h4><div class="border-top pt-3 d-flex justify-content-between text-muted small"><span><i class="bi bi-door-open"></i> {{p.dormitorios}} dorm.</span><span><i class="bi bi-droplet"></i> {{p.banos}} baños</span><span>{{p.superficie}} m²</span></div></div><div class="card-footer bg-white border-0 pb-3"><a href="{% url 'detalle' p.id %}" class="btn btn-outline-primary w-100">Ver detalle</a></div></div>
