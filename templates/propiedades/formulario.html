{% extends 'base.html' %}{% block content %}<main class="container py-5"><div class="row justify-content-center"><div class="col-lg-9"><div class="card border-0 shadow-sm rounded-4"><div class="card-body p-4 p-md-5"><h2 class="fw-bold mb-4">{{titulo}}</h2><form method="post" enctype="multipart/form-data" class="row g-3">{% csrf_token %}{% for field in form %}<div class="col-md-6 {% if field.name == 'descripcion' or field.name == 'imagen' %}col-12{% endif %}"><label class="form-label fw-semibold">{{field.label}}</label>{{field}}{% if field.errors %}<div class="text-danger small">{{field.errors}}</div>{% endif %}</div>{% endfor %}<div class="col-12"><button class="btn btn-primary px-4">Guardar propiedad</button><a href="{% url 'panel' %}" class="btn btn-light">Cancelar</a></div></form></div></div></div></div></main>{% endblock %}
